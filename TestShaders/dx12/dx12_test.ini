; Test mod for the D3D12 engine shim. Copy this folder into Mods of a D3D12
; game running with dx12 = 1.
;
; It draws test.dds half transparent over the whole screen: a red, a green, a
; blue and a white quarter, with red at 0.75 so that the white one is cyan
; tinted. F10 takes green down to a quarter and back, which dims the green
; quarter and turns the white one purple, and the choice survives a restart.
;
; That picture needs [Present], run = CommandList and CustomShader, o0 = bb,
; a [Resource] loaded from a file on ps-t0, IniParams, store, if/else, a key
; and d3dx_user.ini to all work.

[Constants]
global persist $show = 1
global $stored = 0

[KeyToggleShow]
key = no_modifiers F10
type = cycle
$show = 1, 0

[ResourceTest]
filename = test.dds

[ResourceValues]
type = Buffer
format = R32_FLOAT
data = 0.25 0.5 0.75 1.0

[CommandListParams]
store = $stored, ResourceValues, 2
x = $stored
if $show
	y = 1
else
	y = 0.25
endif

[CustomShaderQuad]
vs = quad_vs.hlsl
ps = quad_ps.hlsl
blend = ADD SRC_ALPHA INV_SRC_ALPHA
cull = none
topology = triangle_strip
o0 = bb
ps-t0 = ResourceTest
draw = 4, 0

[Present]
run = CommandListParams
run = CustomShaderQuad
