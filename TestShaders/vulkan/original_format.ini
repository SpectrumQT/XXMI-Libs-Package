[Constants]
global $slot = -1
global $ok = 0
global $outside = -1

[Present]
$outside = ps->srv_original_format(0)

[ShaderRegexEnableTextureOverrides]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
if DRAW_TYPE % 2 == 0
    CheckTextureOverride = ib
endif

[ResourceTestVB]
type = Buffer
stride = 36
filename = tri_vb16.buf

[ResourceTestIB]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = tri_ib.buf

[ResourceConfigRW]
type = RWBuffer
format = R32G32B32A32_FLOAT
array = 8

[ResourceBonesRW]
type = RWStructuredBuffer
stride = 16
array = 4

[ResourcePass]
filename = tex_rgba.dds

[ResourceFail]
filename = tex_bc1.dds

[ResourceReplacement]
filename = replacement_bc7.dds

[ResourceGameConstants]
[ResourceGameBones]

[CustomShaderFill]
cs = fill.hlsl
cs-cb0 = ref ResourceGameConstants
cs-t0 = ref ResourceGameBones
cs-u0 = ref ResourceConfigRW
cs-u1 = ref ResourceBonesRW
dispatch = 1, 1, 1
cs-u0 = null
cs-u1 = null

[TextureOverrideHarnessRegion]
hash = f9cebfae
match_index_count = 6
if DRAW_TYPE == 4 && vs->srv_stride(0) == 16
    ResourceGameConstants = ref vs-cb0
    ResourceGameBones = ref vs-t0
    run = CustomShaderFill
    vs-cb0 = copy ResourceConfigRW
    vs-t0 = ref ResourceBonesRW
    handling = skip
    vb0 = ref ResourceTestVB
    vb0->ElementFormat(BLENDINDICES, 0) = R16G16B16A16_UINT
    ib = ref ResourceTestIB
    $slot = ps->srv_sampled(0)
    if $slot >= 0
        $ok = ps->srv_original_format($slot) == 28 && ps-t[$slot]->format == 28
        $ok = $ok && ps->srv_original_format(127) == -1 && ps->srv_original_format(-1) == -1
        $ok = $ok && vs->srv_original_format(0) == -1 && cs->srv_original_format(0) == -1 && $outside == -1
        ps-t[$slot] = ref ResourceReplacement
        $ok = $ok && ps-t[$slot]->format == 98
        ; A format-based detector must still identify the game's slot after replacement.
        $ok = $ok && ps->srv_original_format($slot) == 28
        ps-t[$slot] = ref ResourceFail
        $ok = $ok && ps->srv_original_format($slot) == 28 && ps-t[$slot]->format == 71
        ps-t[$slot] = null
        $ok = $ok && ps->srv_original_format($slot) == 28 && ps-t[$slot]->format == 28
        if $ok
            ps-t[$slot] = ref ResourcePass
        else
            ps-t[$slot] = ref ResourceFail
        endif
        drawindexedinstanced = 3, INSTANCE_COUNT, 0, 0, FIRST_INSTANCE
    endif
endif
