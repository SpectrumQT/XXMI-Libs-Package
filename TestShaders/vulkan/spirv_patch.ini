; The mod of the SPIR-V ShaderRegex regression: draws its triangle in place of
; the harness's square with a mask at ps-t116 and IniParams x245 set, which
; spirv_patch_group.ini cuts by, and x246, which spirv_patch_vs_group.ini moves
; it by. check_spirv_patch.py changes the marked lines.

[Constants]
global $draw = 0

[Present]
$draw = 0

[ShaderRegexEnableTextureOverrides]
shader_model = vs_4_0 vs_4_1 vs_5_0 vs_5_1
if DRAW_TYPE % 2 == 0
    CheckTextureOverride = ib
endif

[ResourceTestVB]
type = Buffer
stride = 36
filename = tri_vb16.buf

[ResourceTestIB]
type = Buffer
format = DXGI_FORMAT_R16_UINT
filename = tri_ib.buf

[ResourceConfigRW]
type = RWBuffer
format = R32G32B32A32_FLOAT
array = 8

[ResourceBonesRW]
type = RWStructuredBuffer
stride = 16
array = 4

[ResourceMask]
filename = mask.dds

[ResourceGameConstants]
[ResourceGameBones]

[CustomShaderFill]
cs = fill.hlsl
cs-cb0 = ref ResourceGameConstants
cs-t0 = ref ResourceGameBones
cs-u0 = ref ResourceConfigRW
cs-u1 = ref ResourceBonesRW
dispatch = 1, 1, 1
cs-u0 = null
cs-u1 = null

[TextureOverrideHarnessRegion]
hash = f9cebfae
match_index_count = 6
if DRAW_TYPE == 4 && vs->srv_stride(0) == 16
    $draw = $draw + 1
    ; only the first draw of a frame: those after it are the harness's own
    if $draw == 1
        ResourceGameConstants = ref vs-cb0
        ResourceGameBones = ref vs-t0
        run = CustomShaderFill
        vs-cb0 = copy ResourceConfigRW
        vs-t0 = ref ResourceBonesRW
        handling = skip
        vb0 = ref ResourceTestVB
        vb0->ElementFormat(BLENDINDICES, 0) = R16G16B16A16_UINT
        ib = ref ResourceTestIB
        ; guid
        x245 = 245997
        ; vs guid
        x246 = 0
        ; mask
        ps-t116 = ref ResourceMask
        ; draw
        drawindexedinstanced = 3, INSTANCE_COUNT, 0, 0, FIRST_INSTANCE
        ps-t116 = null
        x245 = 0
        x246 = 0
    endif
endif
