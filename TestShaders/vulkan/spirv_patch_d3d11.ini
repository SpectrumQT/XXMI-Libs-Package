; A D3D11 ShaderRegex patch as CutoutMask.ini of a mod has it, with no SPIR-V
; version: the DLL converts it for Vulkan. Where IniParams x245 is 245997 and a
; texture is at t116, the pixel shader discards where the alpha of that is below
; 1. The pattern takes a float4 TEXCOORD, as the harness's shader has its colour
; at Location 0.

[ShaderRegexHarnessD3D11Cut]
shader_model = ps_5_0
temps = ini mask size coord

[ShaderRegexHarnessD3D11Cut.Pattern]
(?=(?:dcl_[^\n]*\n)*?dcl_input_ps[^\n]*\hv1\.(?:xy|xyzw)\n)(?<header>(?:dcl_[^\n]*\n)*?dcl_temps\h\d+\n(?:dcl_[^\n]*\n)*)

[ShaderRegexHarnessD3D11Cut.InsertDeclarations]
dcl_resource_texture1d (float,float,float,float) t120
dcl_resource_texture2d (float,float,float,float) t116

[ShaderRegexHarnessD3D11Cut.Pattern.Replace]
${header}
ld_indexable(texture1d)(float,float,float,float) ${ini}.xyzw, l(245, 0), t120.xyzw\n
eq ${ini}.x, ${ini}.x, l(245997.000000)\n
if_nz ${ini}.x\n
	resinfo_indexable(texture2d)(float,float,float,float) ${size}.xy, l(0), t116.xyzw\n
	add ${size}.z, ${size}.x, ${size}.y\n
	if_nz ${size}.z\n
		frc ${coord}.xy, v1.xyxx\n
		mul ${coord}.xy, ${coord}.xyxx, ${size}.xyxx\n
		ftou ${coord}.xy, ${coord}.xyxx\n
		mov ${coord}.zw, l(0, 0, 0, 0)\n
		ld_indexable(texture2d)(float,float,float,float) ${mask}.w, ${coord}.xyzz, t116.xyzw\n
		lt ${mask}.x, ${mask}.w, l(1.000000)\n
		discard_nz ${mask}.x\n
	endif\n
endif\n
