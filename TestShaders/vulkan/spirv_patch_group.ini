; A ShaderRegex group for SPIR-V, as CutoutMask.ini of a mod has it for D3D11:
; where IniParams x245 is 245997 and a texture is at t116, the pixel shader
; discards where the alpha of that is below 1. The harness's shader has its
; colour at Location 0, which is taken for the coordinates. The lookup lines are
; replaced by check_spirv_patch.py for the sampler case.

[ShaderRegexHarnessCut]
shader_model = ps_5_0
temps = c0 c245 cguid fone fzero pini ini inix on check img size sx sy sum bound fetch uv4 uv frc sizef scaled coord texel alpha cut kill end end2 end3 smp sampled

[ShaderRegexHarnessCut.InsertDeclarations]
dcl_resource_texture1d (float,float,float,float) t120
dcl_resource_texture2d (float,float,float,float) t116
; sampler

[ShaderRegexHarnessCut.SpirvPatternA]
^%zz_in_loc0 = OpVariable %zz_ptr_Input_v4float Input$

[ShaderRegexHarnessCut.SpirvPatternB]
^@zz_globals$

[ShaderRegexHarnessCut.SpirvPatternB.Replace]
${c0} = OpConstant %zz_int 0\n
${c245} = OpConstant %zz_int 245\n
${cguid} = OpConstant %zz_float 245997\n
${fone} = OpConstant %zz_float 1\n
${fzero} = OpConstant %zz_float 0\n
@zz_globals

[ShaderRegexHarnessCut.SpirvPatternC]
^@zz_entry$

[ShaderRegexHarnessCut.SpirvPatternC.Replace]
${pini} = OpAccessChain %zz_ptr_Uniform_v4float %IniParams ${c0} ${c245}\n
${ini} = OpLoad %zz_v4float ${pini}\n
${inix} = OpCompositeExtract %zz_float ${ini} 0\n
${on} = OpFOrdEqual %zz_bool ${inix} ${cguid}\n
OpSelectionMerge ${end} None\n
OpBranchConditional ${on} ${check} ${end}\n
${check} = OpLabel\n
${img} = OpLoad %zz_image2d_float %t116\n
${size} = OpImageQuerySizeLod %zz_v2int ${img} ${c0}\n
${sx} = OpCompositeExtract %zz_int ${size} 0\n
${sy} = OpCompositeExtract %zz_int ${size} 1\n
${sum} = OpIAdd %zz_int ${sx} ${sy}\n
${bound} = OpINotEqual %zz_bool ${sum} ${c0}\n
OpSelectionMerge ${end2} None\n
OpBranchConditional ${bound} ${fetch} ${end2}\n
${fetch} = OpLabel\n
${uv4} = OpLoad %zz_v4float %zz_in_loc0\n
${uv} = OpVectorShuffle %zz_v2float ${uv4} ${uv4} 0 1\n
${frc} = OpExtInst %zz_v2float %zz_glsl Fract ${uv}\n
; lookup
${sizef} = OpConvertSToF %zz_v2float ${size}\n
${scaled} = OpFMul %zz_v2float ${frc} ${sizef}\n
${coord} = OpConvertFToS %zz_v2int ${scaled}\n
${texel} = OpImageFetch %zz_v4float ${img} ${coord} Lod ${c0}\n
; end of lookup
${alpha} = OpCompositeExtract %zz_float ${texel} 3\n
${cut} = OpFOrdLessThan %zz_bool ${alpha} ${fone}\n
OpSelectionMerge ${end3} None\n
OpBranchConditional ${cut} ${kill} ${end3}\n
${kill} = OpLabel\n
OpKill\n
${end3} = OpLabel\n
OpBranch ${end2}\n
${end2} = OpLabel\n
OpBranch ${end}\n
${end} = OpLabel\n
@zz_entry
