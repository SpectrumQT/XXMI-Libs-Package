; A ShaderRegex group for SPIR-V vertex shaders: where IniParams x246 is 246001,
; the harness's vertex shader moves the position 10 to the right in clip space,
; off the screen. It declares no texture, so every draw of a mod with that
; shader is drawn with it, and x246 decides.

[ShaderRegexHarnessMove]
shader_model = vs_5_0
temps = c0 c246 cguid ften pini ini inix on x moved chosen final

[ShaderRegexHarnessMove.InsertDeclarations]
dcl_resource_texture1d (float,float,float,float) t120

[ShaderRegexHarnessMove.SpirvPatternA]
^@zz_globals$

[ShaderRegexHarnessMove.SpirvPatternA.Replace]
${c0} = OpConstant %zz_int 0\n
${c246} = OpConstant %zz_int 246\n
${cguid} = OpConstant %zz_float 246001\n
${ften} = OpConstant %zz_float 10\n
@zz_globals

[ShaderRegexHarnessMove.SpirvPatternB]
^(?<at>%\d+) = OpAccessChain %zz_ptr_Output_v4float (?<block>%\d+) (?<member>%\d+)\nOpStore \k<at> (?<position>%\d+)\n

[ShaderRegexHarnessMove.SpirvPatternB.Replace]
${pini} = OpAccessChain %zz_ptr_Uniform_v4float %IniParams ${c0} ${c246}\n
${ini} = OpLoad %zz_v4float ${pini}\n
${inix} = OpCompositeExtract %zz_float ${ini} 0\n
${on} = OpFOrdEqual %zz_bool ${inix} ${cguid}\n
${x} = OpCompositeExtract %zz_float ${position} 0\n
${moved} = OpFAdd %zz_float ${x} ${ften}\n
${chosen} = OpSelect %zz_float ${on} ${moved} ${x}\n
${final} = OpCompositeInsert %zz_v4float ${chosen} ${position} 0\n
${at} = OpAccessChain %zz_ptr_Output_v4float ${block} ${member}\n
OpStore ${at} ${final}\n
